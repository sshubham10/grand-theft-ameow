<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Theft A-Meow - 20</title>
<style>
:root{--bg:#ffeef4;--ink:#5a3a4a;--bub:#fff;--lick:rgba(255,255,255,.55);--wall:#ffd9e6;--floor:#d9a46b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f2b;--ink:#ffe3ee;--bub:#3d2c3f;--lick:rgba(255,255,255,.3);--wall:#3b2a45;--floor:#6b4a3a}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
h1{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:clamp(16px,3.4vw,24px);margin:0;pointer-events:none;z-index:1}
p.hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;text-align:center;margin:0;font-size:14px;opacity:.75;pointer-events:none}
#cat{position:fixed;left:0;top:0;width:130px;height:120px;z-index:5;cursor:pointer;will-change:transform;transform-origin:65px 120px}
#flip,#hop{width:100%;height:100%}
#flip{transform-origin:50% 100%}
#cat svg{width:100%;height:100%;overflow:visible}
.tail{transform-origin:24px 82px;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(16deg)}}
.leg,#head,.eyes,#tongue{transform-box:fill-box}
.leg{transform-origin:50% 0}
.run .l1,.run .l4{animation:step .32s infinite alternate}
.run .l2,.run .l3{animation:step .32s infinite alternate-reverse}
@keyframes step{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.run #hop{animation:bob .32s infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
#head{transform-origin:50% 90%}
.eyes{transform-origin:50% 50%;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#happy,#tongue,#open{opacity:0}
.licking #happy{opacity:1}.licking .eyes{opacity:0;animation:none}
.licking #head{animation:nod .4s infinite alternate}
@keyframes nod{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(2px)}}
.licking #tongue{transform-origin:50% 0;animation:lick .4s infinite alternate ease-in-out}
@keyframes lick{from{opacity:1;transform:scale(.8,.5) translateX(-5px) rotate(-8deg)}to{opacity:1;transform:scale(1.15,1.5) translateX(6px) rotate(8deg)}}
.licking #mouth{opacity:0}
.mouth-open #open{opacity:1}.mouth-open #mouth{opacity:0}
#brows,#fangs{opacity:0}
.angry #brows,.angry #fangs{opacity:1}
.angry .eyes{transform:scaleY(.6);animation:none}
.angry #head{animation:grr .07s infinite alternate}
@keyframes grr{from{transform:translateX(-1.5px) rotate(-1.5deg)}to{transform:translateX(1.5px) rotate(1.5deg)}}
.angry .tail{animation:wag .22s infinite}
.angry svg{filter:saturate(1.3) drop-shadow(0 0 7px rgba(255,40,40,.75))}
.jump #hop{animation:jump .5s infinite}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-70px) rotate(-12deg)}70%{transform:translateY(-30px) rotate(12deg)}}
.shake #hop{animation:shake .12s 5}
@keyframes shake{50%{transform:translateX(5px) rotate(4deg)}}
#bubble{position:fixed;z-index:9;max-width:min(280px,80vw);background:var(--bub);color:var(--ink);padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;opacity:0;transition:opacity .2s;text-align:center}
#bubble.on{opacity:1}
.smudge{position:fixed;z-index:3;border-radius:50% 45% 55% 50%;background:var(--lick);filter:blur(2px);pointer-events:none;animation:fade 3.2s forwards}
@keyframes fade{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.conf{position:fixed;top:-30px;font-size:24px;z-index:2;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.paw{position:fixed;z-index:1;font-size:16px;pointer-events:none;animation:pfade 4s forwards}
#room{position:fixed;inset:0;z-index:0;background:radial-gradient(circle,rgba(255,255,255,.35) 3px,transparent 4px) 0 0/34px 34px,var(--wall)}
#floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 90px),var(--floor);border-top:6px solid rgba(0,0,0,.18)}
#rug{position:absolute;left:50%;bottom:7%;width:46vw;max-width:520px;height:11%;transform:translateX(-50%);border-radius:50%;background:#ff8fab;opacity:.55;border:4px dashed rgba(255,255,255,.7)}
#bunting{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:2px;padding-top:8px;z-index:1;pointer-events:none}
#bunting::before{content:'';position:absolute;left:0;right:0;top:9px;height:2px;background:#8a6a5a}
#bunting span{width:clamp(20px,5.5vw,38px);height:clamp(26px,7vw,46px);clip-path:polygon(0 0,100% 0,50% 100%);display:flex;justify-content:center;font-weight:800;font-size:clamp(11px,2.6vw,18px);color:#fff;padding-top:5px;box-sizing:border-box}
#bunting i{width:16px}
#poster{position:fixed;top:24%;left:50%;transform:translateX(-50%);z-index:0;background:var(--bub);color:var(--ink);padding:10px 18px;border-radius:10px;border:4px solid #c9893f;text-align:center;font-size:clamp(13px,2.6vw,18px);box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}
.balloon{position:fixed;font-size:clamp(34px,7vw,56px);z-index:0;pointer-events:none;animation:float 4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-16px) rotate(6deg)}}
.pot{position:fixed;bottom:8%;width:clamp(70px,14vw,120px);z-index:2;pointer-events:none}
.pot svg{width:100%;display:block}
#sun{left:4%}#tul{right:4%}
#bunting,#poster,.balloon{display:none}
body.bday #bunting{display:flex}
body.bday #poster{display:block}
body.bday .balloon{display:block}
body.bday #timer{display:none}
#timer{position:fixed;top:24%;left:50%;transform:translateX(-50%);z-index:0;background:var(--bub);color:var(--ink);padding:10px 20px;border-radius:14px;border:4px solid #c9893f;text-align:center;font-size:clamp(12px,2.4vw,16px);box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap}
#timer b{display:block;font-size:clamp(20px,5vw,34px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.bowl{position:fixed;z-index:4;margin:-20px 0 0 -35px;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:8}
#ui button{font:inherit;font-size:15px;padding:9px 16px;border-radius:999px;border:2px solid #fff;background:#ff7aa2;color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#ui button:active{transform:scale(.95)}
.sneeze #head{animation:sn 1s}
.sneeze .eyes{transform:scaleY(.1);animation:none}
@keyframes sn{0%{transform:none}30%{transform:translateY(-5px) rotate(-12deg)}45%{transform:translateY(6px) rotate(14deg) scale(1.05)}65%{transform:rotate(-5deg)}100%{transform:none}}
.puff{position:fixed;z-index:6;font-size:22px;pointer-events:none;animation:puff .9s forwards}
@keyframes puff{to{transform:translate(var(--dx),-20px) scale(1.9);opacity:0}}
@keyframes pfade{0%{opacity:.85}100%{opacity:0}}
</style>
</head>
<body>
<h1>Grand Theft A-Meow - 20</h1>
<p class="hint">move your cursor, tap the screen but dont try touching me</p>
<div id="room"><div id="floor"></div><div id="rug"></div></div>
<div id="bunting"></div>
<div id="poster">🎂 Happy Birthday<br><b>Chehak!</b> 🎉</div>

<div class="balloon" style="left:3%;top:16%">🎈</div><div class="balloon" style="left:11%;top:30%;animation-delay:-1s">🎈</div><div class="balloon" style="right:3%;top:16%;animation-delay:-2s">🎈</div><div class="balloon" style="right:11%;top:30%;animation-delay:-3s">🎈</div>

<div id="cat"><div id="flip"><div id="hop">
<svg viewBox="0 0 130 120">
 <defs>

 </defs>
 <ellipse cx="62" cy="116" rx="42" ry="5" fill="rgba(0,0,0,.14)"/>

<script>
const cat=document.getElementById('cat'),flip=document.getElementById('flip'),bub=document.getElementById('bubble');
const BDAY_M=11,BDAY_D=2;
let x=innerWidth/2,y=innerHeight/2,px=x,py=y,dir=1,mode='follow',tx=0,ty=0,busy=false,bt,sc=1,tsc=1,lx=0,ly=0,pawD=0,pawSide=1,stopPurr=null,pend=null,sneezeCD=0,bowlEl=null;

function bdayInfo(){
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let b=new Date(now.getFullYear(),BDAY_M,BDAY_D);
  if(location.hash==='#bday')return{today:true,days:0,now};
  if(b<t0)b=new Date(now.getFullYear()+1,BDAY_M,BDAY_D);
  const days=Math.round((b-t0)/864e5);
  return{today:days===0,days,now};
}

/* ---------- sound ---------- */
let ac,nb;
function audio(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A){ac=new A();nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}}
  if(ac&&ac.state==='suspended')ac.resume();return ac;
}
function meow(f=600,dur=.6,when=0,vol=.5){
  const a=audio();if(!a)return;const t=a.currentTime+when;
  const o=a.createOscillator();o.type='sawtooth';
  const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=6+Math.random()*2;lg.gain.value=f*.02;lfo.connect(lg);lg.connect(o.frequency);
  o.frequency.setValueAtTime(f*.85,t);o.frequency.exponentialRampToValueAtTime(f*1.3,t+dur*.3);o.frequency.exponentialRampToValueAtTime(f*.62,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.05);g.gain.linearRampToValueAtTime(vol*.7,t+dur*.65);g.gain.linearRampToValueAtTime(0,t+dur);
  [[650,1100,700,5,1],[1500,2700,1500,8,.6],[3200,3600,3000,6,.25]].forEach(([a0,a1,a2,q,m])=>{
    const bp=a.createBiquadFilter(),mg=a.createGain();bp.type='bandpass';bp.Q.value=q;mg.gain.value=m;
    bp.frequency.setValueAtTime(a0,t);bp.frequency.linearRampToValueAtTime(a1,t+dur*.35);bp.frequency.linearRampToValueAtTime(a2,t+dur);
    o.connect(bp);bp.connect(mg);mg.connect(g);
  });
  g.connect(a.destination);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);
}
function pad(){
  const a=audio();if(!a)return;const t=a.currentTime;
  const s=a.createBufferSource(),lp=a.createBiquadFilter(),g=a.createGain();
  s.buffer=nb;lp.type='lowpass';lp.frequency.value=420+Math.random()*200;
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.09,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.07);
  s.connect(lp);lp.connect(g);g.connect(a.destination);s.start(t,Math.random(),.1);
}
function purr(){
  const a=audio();if(!a)return()=>{};
  const m=a.createGain(),amp=a.createGain(),lp=a.createBiquadFilter(),bp=a.createBiquadFilter();
  const t=a.currentTime;m.gain.setValueAtTime(0,t);m.gain.linearRampToValueAtTime(.55,t+.4);
  amp.gain.value=.5;lp.type='lowpass';lp.frequency.value=320;bp.type='bandpass';bp.frequency.value=170;bp.Q.value=.7;
  const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=25;lg.gain.value=.5;lfo.connect(lg);lg.connect(amp.gain);
  const n=a.createBufferSource();n.buffer=nb;n.loop=true;n.connect(bp);bp.connect(amp);
  const o=a.createOscillator();o.type='sawtooth';o.frequency.value=52;o.connect(lp);lp.connect(amp);
  amp.connect(m);m.connect(a.destination);n.start();o.start();lfo.start();
  return()=>{const e=a.currentTime;m.gain.cancelScheduledValues(e);m.gain.setValueAtTime(m.gain.value,e);m.gain.linearRampToValueAtTime(0,e+.4);[n,o,lfo].forEach(s=>s.stop(e+.45));};
}
function hiss(){
  const a=audio();if(!a)return;const t=a.currentTime;
  const s=a.createBufferSource(),hp=a.createBiquadFilter(),g=a.createGain();
  s.buffer=nb;hp.type='highpass';hp.frequency.value=3200;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.08);g.gain.linearRampToValueAtTime(.25,t+.5);g.gain.linearRampToValueAtTime(0,t+.8);
  s.connect(hp);hp.connect(g);g.connect(a.destination);s.start(t,Math.random(),.9);
}
function growl(when=0,dur=1.1){
  const a=audio();if(!a)return;const t=a.currentTime+when;
  const o=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain(),lp=a.createBiquadFilter(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(75,t+dur);
  lfo.frequency.value=32;lg.gain.value=.25;lfo.connect(lg);lg.connect(g.gain);
  lp.type='lowpass';lp.frequency.value=520;lp.Q.value=3;
  g.gain.setValueAtTime(.3,t);
  o.connect(lp);lp.connect(g);g.connect(a.destination);
  const e=a.createGain();e.gain.setValueAtTime(1,t);
  o.start(t);lfo.start(t);o.stop(t+dur);lfo.stop(t+dur);
}
function speak(html,ms=4500){
  bub.innerHTML=html;bub.classList.add('on');placeBubble();
  clearTimeout(bt);bt=setTimeout(()=>bub.classList.remove('on'),ms);
}
function placeBubble(){
  const w=bub.offsetWidth,h=bub.offsetHeight;
  let bx=Math.min(Math.max(x-w/2,8),innerWidth-w-8),by=y+15-125*sc-h;
  if(by<8)by=8;
  bub.style.left=bx+'px';bub.style.top=by+'px';
}
function paw(a,step){
  pawD+=step;if(pawD<30)return;pawD=0;pawSide*=-1;pad();
  const p=document.createElement('div');p.className='paw';p.textContent='🐾';
  p.style.left=(x-Math.sin(a)*7*pawSide-8)+'px';p.style.top=(y+8+Math.cos(a)*7*pawSide)+'px';
  p.style.transform='rotate('+(a+Math.PI/2)+'rad)';
  document.body.appendChild(p);setTimeout(()=>p.remove(),4200);
}

/* ---------- interactions ---------- */
let tStart=null,dragging=false,onCat=false;
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){
    if(!tStart)return;
    if(!dragging&&Math.hypot(e.clientX-tStart.x,e.clientY-tStart.y)>10){
      dragging=true;clearBowl();bub.classList.remove('on');
      if(!busy){mode='follow';cat.classList.remove('licking');if(stopPurr){stopPurr();stopPurr=null;}}
    }
    if(!dragging)return;
  }
  px=e.clientX;py=e.clientY;
  if(mode==='lick'||mode==='goto'||mode==='eat'||busy)return;mode='follow';
});
addEventListener('pointerdown',e=>{
  audio();
  if(e.pointerType==='touch'){tStart={x:e.clientX,y:e.clientY};dragging=false;onCat=cat.contains(e.target);return;}
  if(cat.contains(e.target)||busy)return;
  tapGo(e.clientX,e.clientY);
});
function tapGo(cx,cy){
  clearBowl();tx=cx;ty=cy;px=tx;py=ty;mode='goto';bub.classList.remove('on');
  if(stopPurr){stopPurr();stopPurr=null;}cat.classList.remove('licking');
}
addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||!tStart)return;
  const was=dragging,oc=onCat;tStart=null;dragging=false;onCat=false;
  if(was||busy)return;
  if(oc&&sc<1.3&&mode!=='lick')touchCat();else tapGo(e.clientX,e.clientY);
});
addEventListener('pointercancel',()=>{tStart=null;dragging=false;});
cat.addEventListener('pointerdown',e=>{audio();if(e.pointerType==='touch')return;e.stopPropagation();touchCat();});

function touchCat(){
  if(busy)return;
  busy=true;mode='busy';clearBowl();
  if(stopPurr){stopPurr();stopPurr=null;}cat.classList.remove('licking');
  const info=bdayInfo();
  if(info.today){birthday();return;}
  cat.classList.add('shake','mouth-open','angry');
  hiss();growl(.1,1.1);meow(360,.8,1.2,.6);meow(300,1,2,.6);
  const n=info.days;
  speak(`😾 <b>MEOW MEOW MEOW!</b> I'll bite you, Chehak 😼<br>Because today isn't your bday.<br><b>You have ${n} day${n===1?'':'s'} remaining till you can touch me!</b> 🎂`,6500);
  setTimeout(()=>cat.classList.remove('shake'),900);
  setTimeout(()=>cat.classList.remove('mouth-open','angry'),3300);
  setTimeout(()=>{busy=false;mode='follow';},3600);
}

function birthday(){
  cat.classList.add('jump','mouth-open');
  confetti();
  speak('🎉 <b>HAPPY BIRTHDAY!!!</b> 🎂<br>Meow meow meow-meow meow meow~',14000);
  const S=[[0,.75],[0,.25],[2,1],[0,1],[5,1],[4,2],[0,.75],[0,.25],[2,1],[0,1],[7,1],[5,2],[0,.75],[0,.25],[12,1],[9,1],[5,1],[4,1],[2,2],[10,.75],[10,.25],[9,1],[5,1],[7,1],[5,2.5]];
  const beat=.42;let t=0;
  S.forEach(([s,d])=>{meow(262*Math.pow(2,s/12)*1.7,Math.max(.25,d*beat*.9),t);t+=d*beat;});
  setTimeout(()=>{cat.classList.remove('jump','mouth-open');busy=false;mode='follow';},t*1000+400);
  const iv=setInterval(confetti,1500);setTimeout(()=>clearInterval(iv),t*1000);
}
function confetti(){
  const em=['🎉','🎈','🎂','✨','🐾','🎊'];
  for(let i=0;i<18;i++){const c=document.createElement('div');c.className='conf';c.textContent=em[i%em.length];
    c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),6500);}
}

function lick(){
  mode='lick';cat.classList.remove('run');
  tsc=Math.min(3.2,innerHeight/190);
  lx=Math.min(Math.max(x,70*tsc),innerWidth-70*tsc);
  ly=Math.min(innerHeight-20,Math.max(y,118*tsc));
  setTimeout(()=>{
    if(mode!=='lick')return;
    cat.classList.add('licking');stopPurr=purr();
    const s=document.createElement('div');s.className='smudge';
    const w=100*sc*.7,h=80*sc*.7;
    s.style.width=w+'px';s.style.height=h+'px';s.style.marginLeft=-w/2+'px';s.style.marginTop=-h/2+'px';
    s.style.left=(x+dir*5*sc)+'px';s.style.top=(y+15-38*sc)+'px';
    document.body.appendChild(s);setTimeout(()=>s.remove(),3300);
    speak('😾 <b>Stop dirtying my screen!!</b>',2800);
  },900);
  setTimeout(()=>{cat.classList.remove('licking');if(stopPurr){stopPurr();stopPurr=null;}if(mode==='lick')mode='idle';},3600);
}

/* ---------- room, plants, feeding ---------- */
const tul=document.getElementById('tul'),sun=document.getElementById('sun');
const bun=document.getElementById('bunting'),cols=['#ff6b8b','#ffd23f','#4ecdc4','#a78bfa','#ff9f43'];let ki=0;
['HAPPY','BDAY','CHEHAK'].forEach((w,wi)=>{[...w].forEach(c=>{const s=document.createElement('span');s.textContent=c;s.style.background=cols[ki++%5];bun.appendChild(s);});if(wi<2)bun.appendChild(document.createElement('i'));});
const POT='<path d="M22 100 H78 L72 146 H28Z" fill="#c96b3b"/><rect x="18" y="94" width="64" height="12" rx="4" fill="#e07b45"/>';
let pet='';for(let i=0;i<12;i++)pet+=`<ellipse cx="50" cy="16" rx="6" ry="13" fill="#ffc400" transform="rotate(${i*30} 50 38)"/>`;
sun.innerHTML=`<svg viewBox="0 0 100 150"><path d="M50 100 V42" stroke="#3d8f3c" stroke-width="5"/><path d="M50 85 Q28 80 22 66 Q42 66 50 85Z M50 78 Q72 74 80 60 Q58 60 50 78Z" fill="#4caf50"/>${pet}<circle cx="50" cy="38" r="13" fill="#6b3f1d"/>${POT}</svg>`;
const tp=(cx,cy,c)=>`<path d="M${cx} ${cy+24} V100" stroke="#3d8f3c" stroke-width="4"/><path d="M${cx-10} ${cy} Q${cx-11} ${cy+24} ${cx} ${cy+26} Q${cx+11} ${cy+24} ${cx+10} ${cy} L${cx+5} ${cy+7} L${cx} ${cy-4} L${cx-5} ${cy+7}Z" fill="${c}"/>`;
tul.innerHTML=`<svg viewBox="0 0 100 150"><path d="M50 100 Q28 85 32 62 Q50 80 50 100Z M50 100 Q72 85 68 62 Q50 80 50 100Z" fill="#4caf50"/>${tp(28,52,'#ff8fab')}${tp(72,56,'#ffb347')}${tp(50,40,'#ff4d6d')}${POT}</svg>`;
const bowlSVG=k=>`<svg viewBox="0 0 70 40" width="70"><path d="M4 16 Q8 38 35 38 Q62 38 66 16Z" fill="#6c8cff"/><ellipse cx="35" cy="16" rx="31" ry="9" fill="#dfe6ff"/>${k==='milk'?'<ellipse cx="35" cy="16" rx="26" ry="6.5" fill="#fff"/>':'<ellipse cx="35" cy="16" rx="26" ry="6.5" fill="#8a5a2b"/><circle cx="26" cy="13" r="3" fill="#b7793c"/><circle cx="36" cy="11" r="3" fill="#a56a30"/><circle cx="45" cy="14" r="3" fill="#b7793c"/><circle cx="33" cy="17" r="3" fill="#c9893f"/>'}</svg>`;
function clearBowl(){pend=null;if(bowlEl){bowlEl.remove();bowlEl=null;}}
function feed(kind){
  if(busy)return;clearBowl();
  const bx=innerWidth*(.3+Math.random()*.4),by=Math.min(innerHeight*.84,innerHeight-175);
  const b=document.createElement('div');b.className='bowl';b.style.left=bx+'px';b.style.top=by+'px';b.innerHTML=bowlSVG(kind);document.body.appendChild(b);bowlEl=b;
  const side=x<bx?-1:1;tx=bx+side*58;ty=by-5;mode='goto';pend={kind,face:-side};
  cat.classList.remove('licking');if(stopPurr){stopPurr();stopPurr=null;}bub.classList.remove('on');
}
function eat(){
  const k=pend.kind;dir=pend.face;pend=null;mode='eat';cat.classList.remove('run');cat.classList.add('licking');stopPurr=purr();
  speak(k==='milk'?'🥛 <b>slurp slurp~</b> yummy milk!':'🍖 <b>nom nom nom!</b> yummy food!',3200);
  setTimeout(()=>{if(mode!=='eat')return;cat.classList.remove('licking');if(stopPurr){stopPurr();stopPurr=null;}clearBowl();speak('😻 Thank you, Chehak! Now dont touch me 😼',3000);mode='idle';},3400);
}
function achoo(){
  const a=audio();if(!a)return;const t=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1100,t+.35);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.1);g.gain.linearRampToValueAtTime(0,t+.38);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.4);
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g2=a.createGain();s.buffer=nb;bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.8;
  g2.gain.setValueAtTime(0,t+.4);g2.gain.linearRampToValueAtTime(.55,t+.43);g2.gain.exponentialRampToValueAtTime(.001,t+.7);
  s.connect(bp);bp.connect(g2);g2.connect(a.destination);s.start(t+.4,Math.random(),.3);meow(900,.3,.75,.3);
}
function sneeze(){
  sneezeCD=420;cat.classList.add('sneeze');
  speak('🤧 <b>Ah-CHOO!!</b> Tulips make me sneeze!',2800);achoo();
  setTimeout(()=>{const p=document.createElement('div');p.className='puff';p.textContent='💨';p.style.left=(x+dir*40*sc)+'px';p.style.top=(y-45)+'px';p.style.setProperty('--dx',dir*80+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),900);},420);
  setTimeout(()=>cat.classList.remove('sneeze'),1100);
}
let wasB=false;
function tick(){
  const i=bdayInfo(),el=document.getElementById('timer');
  document.body.classList.toggle('bday',i.today);
  if(i.today){if(!wasB){wasB=true;confetti();}return;}
  wasB=false;
  const n=new Date();let t=new Date(n.getFullYear(),BDAY_M,BDAY_D);if(t<n)t=new Date(n.getFullYear()+1,BDAY_M,BDAY_D);
  let s=Math.floor((t-n)/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;
  const p=v=>String(v).padStart(2,'0');
  el.innerHTML=`⏳ Chehak's bday in<b>${d}d ${p(h)}h ${p(m)}m ${p(s)}s</b>until the party 🎈`;
}
tick();setInterval(tick,1000);
document.getElementById('ui').addEventListener('pointerdown',e=>{e.stopPropagation();audio();});
document.getElementById('bMilk').onclick=()=>feed('milk');
document.getElementById('bFood').onclick=()=>feed('food');

/* ---------- loop ---------- */
function frame(){
  let moving=false;
  if(mode==='follow'||mode==='goto'){
    const gx=mode==='goto'?tx:px,gy=mode==='goto'?ty:py;
    const stop=mode==='goto'?6:90;
    const dx=gx-x,dy=gy-y,d=Math.hypot(dx,dy);
    if(d>stop){
      const sp=mode==='goto'?Math.min(5,d*.05+2.2):Math.min(3.2,d*.03+1.3);
      x+=dx/d*sp;y+=dy/d*sp;moving=true;paw(Math.atan2(dy,dx),sp);
      if(Math.abs(dx)>6)dir=dx>0?1:-1;
    }else if(mode==='goto'){
      if(pend)eat();else lick();
    }
  }
  if(sneezeCD>0)sneezeCD--;
  else if(!busy&&mode!=='lick'&&mode!=='eat'){const r=tul.getBoundingClientRect();if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height*.3))<115)sneeze();}
  if(mode==='lick'){x+=(lx-x)*.1;y+=(ly-y)*.1;}else tsc=1;
  sc+=(tsc-sc)*.12;
  cat.classList.toggle('run',moving);
  flip.style.transform=`scaleX(${dir})`;
  cat.style.transform=`translate(${x-65}px,${y-105}px) scale(${sc})`;
  if(bub.classList.contains('on'))placeBubble();
  requestAnimationFrame(frame);
}
frame();
</script>
